import java.util.Properties

plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
def releaseBuildRequested = gradle.startParameter.taskNames.any { taskName ->
    taskName.toLowerCase().contains("release")
}
def sampleMobileAdsApplicationId = "ca-app-pub-3940256099942544~3347511713"
def configuredMobileAdsApplicationId = (System.getenv("NURTLY_MOBILE_ADS_ANDROID_APP_ID") ?: "").trim()
def mobileAdsApplicationId = releaseBuildRequested ? configuredMobileAdsApplicationId : sampleMobileAdsApplicationId
if (releaseBuildRequested) {
    if (!mobileAdsApplicationId || mobileAdsApplicationId == sampleMobileAdsApplicationId) {
        throw new GradleException("Release Mobile Ads application ID must be configured externally and must not be the Google sample ID.")
    }
    if (!(mobileAdsApplicationId ==~ /ca-app-pub-[0-9]{16}~[0-9]{10}/)) {
        throw new GradleException("Release Mobile Ads application ID has an invalid format.")
    }
}
if (releaseBuildRequested && !keystorePropertiesFile.exists()) {
    throw new GradleException(
            "Missing app/android/key.properties. Create it before running release builds.")
}
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}
def releaseSigningKeys = ['storePassword', 'keyPassword', 'keyAlias', 'storeFile']
def missingReleaseSigningKeys = releaseSigningKeys.findAll { key ->
    !keystoreProperties.containsKey(key) || keystoreProperties[key].toString().trim().isEmpty()
}
if (releaseBuildRequested && keystorePropertiesFile.exists() && !missingReleaseSigningKeys.isEmpty()) {
    throw new GradleException(
            "Missing required app/android/key.properties fields: ${missingReleaseSigningKeys.join(', ')}")
}

android {
    namespace = "com.graylion.nurtly"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17
    }

    defaultConfig {
        applicationId = "com.graylion.nurtly"
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
        manifestPlaceholders.nurtlyMobileAdsAndroidAppId = mobileAdsApplicationId
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile rootProject.file(keystoreProperties["storeFile"] as String)
                storePassword keystoreProperties["storePassword"] as String
                keyAlias keystoreProperties["keyAlias"] as String
                keyPassword keystoreProperties["keyPassword"] as String
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
        }
    }
}

flutter {
    source = "../.."
}
