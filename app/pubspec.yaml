name: nurtly
description: Simple support for calm, connected parenting.
publish_to: 'none'
version: 0.1.0+4

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  just_audio: ^0.10.5
  google_mobile_ads: ^5.1.0
  in_app_purchase: ^3.2.0
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/content/nurtly_content_en_v1.json
    - assets/content/nurtly_content_pl_v1.json
    - assets/audio/
    - assets/images/sounds/
