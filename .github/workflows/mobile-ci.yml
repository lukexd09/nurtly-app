name: Mobile CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: mobile-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-ci-gate:
    name: PR CI gate
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520 # v5.4.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.41.9'
          channel: stable
          cache: false

      - name: Print Java version
        run: java -version

      - name: Print Flutter version
        run: flutter --version

      - name: Print Dart version
        run: dart --version

      - name: Resolve dependencies
        run: flutter pub get --enforce-lockfile

      - name: Verify lockfile unchanged
        run: git diff --exit-code -- pubspec.lock

      - name: Check Dart formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Run Flutter analyze
        run: flutter analyze

      - name: Run Flutter tests
        run: flutter test --reporter expanded

      - name: Cleanup Flutter generated local files
        run: pwsh -NoLogo -NoProfile -File ../tools/cleanup_flutter_local.ps1

      - name: Run scope guard
        run: pwsh -NoLogo -NoProfile -File ../tools/check_scope_guard.ps1

      - name: Run Mobile Ads configuration regression tests
        working-directory: .
        run: pwsh -NoLogo -NoProfile -File tools/test_mobile_ads_release_config.ps1

      - name: Build debug Android APK
        run: flutter build apk --debug --no-pub

      - name: Verify tracked files unchanged
        working-directory: .
        run: git diff --exit-code
